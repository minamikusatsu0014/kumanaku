<style>/* Leaflet 1.9.4（本体に内蔵） */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,

	}

	}

	}

}

.leaflet-container .leaflet-tile-pane img,

}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {

	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

}

	touch-action: none;
}

}

	}

.leaflet-overlay-pane svg {

.leaflet-tile-pane    { z-index: 200; }

.leaflet-map-pane canvas { z-index: 100; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}

	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

	}
.leaflet-top {
	top: 0;

.leaflet-right {
	right: 0;

.leaflet-bottom {
	bottom: 0;

.leaflet-left {

	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}

}

.leaflet-zoom-anim .leaflet-zoom-animated {

.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {

.leaflet-zoom-anim .leaflet-zoom-hide {

.leaflet-image-layer,
.leaflet-pane > svg path,

/* general typography */

	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	display: block;

.leaflet-bar a,

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

	}
.leaflet-bar a:first-child {

	}

	}

	}

.leaflet-touch .leaflet-bar a {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;

	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;

	font-size: 13px;

	}
.leaflet-popup-content p {
	margin: 17px 0;

	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;

	margin-top: -1px;

	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;
	color: #333;
	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {
	position: absolute;
	top: 0;
	right: 0;
	border: none;

	width: 24px;

	text-decoration: none;
	background: transparent;
	}
.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

	}
.leaflet-popup-scrolled {

	}

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";

	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,

.leaflet-div-icon {
	background: #fff;

	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;

	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {

	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {

	margin-right: -12px;

.leaflet-tooltip-right:before {

@media print {

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
#map{position:absolute;inset:0;background:#dfe7ee}
#hud{position:fixed;left:6px;top:6px;z-index:1200;background:rgba(255,255,255,.95);border:2px solid #12314f;border-radius:10px;padding:5px 9px;max-width:60vw;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#hudT{font-size:12px;font-weight:700;color:#12314f;white-space:nowrap}
#hudS{font-size:11px;color:#333;margin-top:2px}
#tools{position:fixed;right:5px;top:6px;z-index:1200;display:flex;flex-direction:column;gap:4px}
.t{width:44px;height:44px;font-size:19px;line-height:1;border:2px solid #fff;border-radius:11px;background:#12314f;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:0}
.t.on{background:#f5b400;color:#111;border-color:#12314f}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1500;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -3px 14px rgba(0,0,0,.3);transform:translateY(105%);transition:transform .18s ease-out;max-height:64vh;display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
#sHead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #e3e3e3}
#sTitle{font-size:13px;color:#12314f}
#sClose{width:36px;height:36px;font-size:16px;border:2px solid #12314f;border-radius:9px;background:#fff;color:#12314f}
#sBody{padding:9px 10px 18px;overflow:auto;-webkit-overflow-scrolling:touch;font-size:13px}
#sBody button{font-size:13px;padding:9px 11px;margin:3px 4px 3px 0;border:2px solid #12314f;border-radius:9px;background:#f4f7fa;color:#12314f;font-weight:700}
#sBody button.primary{background:#12314f;color:#fff}
#sBody button.danger{background:#b00020;color:#fff;border-color:#fff}
#sBody textarea{width:100%;font-size:14px;padding:8px;border:2px solid #c9d4de;border-radius:8px}
#sBody .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#sBody .kv{display:flex;justify-content:space-between;border-bottom:1px dashed #ddd;padding:5px 0}
#sBody .item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:6px 0}
#sBody .item img{width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid #ccc}
#sBody .muted{color:#666;font-size:12px;line-height:1.5}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:2000;background:rgba(17,17,17,.92);color:#fff;font-size:13px;padding:8px 13px;border-radius:10px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#err{position:fixed;left:5px;right:5px;bottom:5px;z-index:2000;background:#b00020;color:#fff;font-size:12px;padding:7px 9px;border-radius:9px;display:none;white-space:pre-wrap;max-height:26vh;overflow:auto}
#navBar{position:fixed;left:5px;right:5px;bottom:6px;z-index:1400;background:rgba(255,255,255,.96);border:2px solid #12314f;border-radius:11px;padding:7px 9px;display:none}
#navBar.show{display:block}
#navT{font-size:13px;font-weight:700;color:#12314f}
#navS{font-size:11px;color:#444;margin-top:2px}
#navBar button{font-size:12px;padding:7px 9px;margin-top:5px;margin-right:4px;border:2px solid #12314f;border-radius:8px;background:#12314f;color:#fff;font-weight:700}
#navBar button.alt{background:#fff;color:#12314f}
.leaflet-popup-content{font-size:12px;line-height:1.45}
.pdot{width:16px;height:16px;border-radius:50%;background:#1e88e5;border:3px solid #fff;box-shadow:0 0 0 2px rgba(30,136,229,.5)}
</style>

<div id="hud"><div id="hudT">街道ウォーキング <b id="ver">v2.0</b></div><div id="hudS">起動中…</div></div>

  function onErr(e) { errN++; el('navT').textContent = 'ナビ：位置情報を取得できません（' + ((e && e.message) || 'エラー') + '）'; if (errN === 1) toast('位置情報の許可を確認してください'); }
  function start() {
    on = true; done = false; lastRemain = -1;
    el('navBar').className = 'show'; el('bNav').className = 't on';
    target = pick(null);
    if (!navigator.geolocation) { el('navT').textContent = 'この端末では位置情報が使えません'; return; }
    if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) { } }
    watchId = navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    toast(target ? 'ナビを開始しました（' + (target.name || '手描き線') + '）' : '線が無いので追従だけ開始しました');
    speak('ナビを開始します');
  }
  function stop() {
    on = false;
    if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) { } watchId = null; }
    el('navBar').className = ''; el('bNav').className = 't';
    if (dot) { try { map.removeLayer(dot); } catch (e) { } dot = null; }
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
    toast('ナビを停止しました');
  }
  function init(m) {
    map = m;
    el('navX').onclick = stop;
    el('navF').onclick = function () { follow = !follow; el('navF').textContent = '追従：' + (follow ? 'ON' : 'OFF'); if (follow && dot) map.setView(dot.getLatLng(), Math.max(map.getZoom(), 15)); };
    return true;
  }
  KM2.nav = { init: init, start: start, stop: stop, isOn: function () { return on; }, state: function () { return { on: on, follow: follow, targetPts: target ? target.pts.length : 0, err: errN }; } };
})();
/* ================= 7. 歩行記録とまとめ ================= */
(function () {
  var S = KM2.store, map, rec = false, watchId = null, line = null, last = null;
  function toast(m) { KM2.ui.toast(m); }
  function T() { var t = S.getTrack(); if (!t || !Array.isArray(t.pts)) t = { v: 2, pts: [] }; return t; }
  function total() { var t = T(), d = 0, i; for (i = 1; i < t.pts.length; i++) d += KM2.draw.distM([t.pts[i - 1][0], t.pts[i - 1][1]], [t.pts[i][0], t.pts[i][1]]); return d; }
  function today() {
    var t = T(), d = 0, i, z = new Date(); z.setHours(0, 0, 0, 0);
    for (i = 1; i < t.pts.length; i++) { if ((t.pts[i][2] || 0) < z.getTime()) continue; d += KM2.draw.distM([t.pts[i - 1][0], t.pts[i - 1][1]], [t.pts[i][0], t.pts[i][1]]); }
    return d;
  }
  function render() {
    var t = T(), p = [], i;
    for (i = 0; i < t.pts.length; i++) p.push([t.pts[i][0], t.pts[i][1]]);
    if (line) { try { map.removeLayer(line); } catch (e) { } line = null; }
    if (p.length > 1) line = L.polyline(p, { color: '#1e88e5', weight: 4, opacity: .8, dashArray: '6 6', interactive: false }).addTo(map);
  }
  function onFix(pos) {
    if (!rec) return;
    var p = [pos.coords.latitude, pos.coords.longitude, Date.now()];
    if (last && KM2.draw.distM([last[0], last[1]], [p[0], p[1]]) < 10) return;
    var t = T(); t.pts.push(p);
    if (t.pts.length > 40000) t.pts = t.pts.slice(-40000);
    S.setTrack(t); last = p; render(); KM2.onChange();
  }
  function start() {
    if (rec) { toast('すでに記録中です'); return; }
    if (!navigator.geolocation) { toast('位置情報が使えません'); return; }
    rec = true; watchId = navigator.geolocation.watchPosition(onFix, function (e) { toast('位置情報エラー：' + (e.message || '')); }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
    var b = document.getElementById('bRec'); if (b) b.className = 't on';
    toast('記録を開始しました');
  }
  function stop() {
    rec = false;
    if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch (e) { } watchId = null; }
    var b = document.getElementById('bRec'); if (b) b.className = 't';
    toast('記録を停止しました');
  }
  function visited() {
    var t = T(), d = KM2.poi.data(), n = 0, i, j, seen = {};
    for (i = 0; i < t.pts.length; i += 2) {
      for (j = 0; j < d.length; j++) {
        if (seen[j]) continue;
        if (KM2.draw.distM([t.pts[i][0], t.pts[i][1]], [d[j].lat, d[j].lng]) < 150) { seen[j] = 1; n++; }
      }
    }
    return n;
  }
  function fmt(m) { return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m'; }
  function build() {
    var c = KM2.draw.count(), md = KM2.media.count(), st = S.stats(), mig = S.lastMig(), tot = KM2.poi.data().length, v = visited();
    var rows = [
      ['手描きの線', c.lines + ' 本 / ' + c.pts + ' 点'],
      ['記録した距離（合計）', fmt(total())],
      ['今日の距離', fmt(today())],
      ['記録の点数', T().pts.length + ' 点'],
      ['訪問した名所', v + ' / ' + tot + ' 件（' + (tot ? (v / tot * 100).toFixed(1) : '0.0') + '%）'],
      ['写真 / メモ', md.photos + ' 枚 / ' + md.notes + ' 件'],
      ['保存データ', Math.round(st.bytes / 1024) + ' KB（' + st.keys + ' 項目）']
    ];
    if (mig) rows.push(['旧アプリからの引き継ぎ', new Date(mig.at).toLocaleString('ja-JP') + ' ・ ' + mig.added + ' 本を追加（合計 ' + mig.total + ' 本）']);
    var h = '';
    for (var i = 0; i < rows.length; i++) h += '<div class="kv"><span>' + rows[i][0] + '</span><b>' + rows[i][1] + '</b></div>';
    h += '<div class="muted" style="margin-top:8px">名所は拡大（ズーム11以上）で表示。訪問は記録した軌跡から150m以内で判定します。</div>';
    return h;
  }
  function init(m) { map = m; render(); return true; }
  KM2.track = { init: init, start: start, stop: stop, onFix: onFix, total: total, today: today, isRec: function () { return rec; }, visited: visited, build: build, render: render };
})();
/* ================= 起動とUI ================= */
(function () {
  var S = KM2.store, map = null;
  function el(i) { return document.getElementById(i); }
  function toast(m, ms) {
    var t = el('toast'); t.textContent = m; t.className = 'show';
    if (toast.t) clearTimeout(toast.t);
    toast.t = setTimeout(function () { t.className = ''; }, ms || 2800);
  }
  function err(m) { var e = el('err'); e.style.display = 'block'; e.textContent = String(m).slice(0, 600); }
  KM2.ui = { toast: toast, err: err };
  function sheet(title, html, after) { el('sTitle').textContent = title; el('sBody').innerHTML = html; el('sheet').className = 'open'; if (after) after(); }
  function close() { el('sheet').className = ''; }
  function hud() {
    var c = KM2.draw.count(), t = KM2.track.total();
    el('hudS').textContent = '線 ' + c.lines + '本 / ' + c.pts + '点 ・ 記録 ' + (t >= 1000 ? (t / 1000).toFixed(2) + 'km' : Math.round(t) + 'm') + (KM2.track.isRec() ? ' ●記録中' : '');
  }
  KM2.onChange = function () { try { hud(); } catch (e) { } };
  function center() { var c = map.getCenter(); return { lat: c.lat, lng: c.lng }; }
  function sheetData() {
    var h = '<div class="row"><button class="primary" id="dSave">💾 保存（線も含む）</button><button id="dLoad">📥 読込（JSON/GPX/KML）</button></div>' +
      '<div class="row"><button id="dGpx">⬇ GPX書き出し</button><button id="dKml">⬇ KML書き出し</button></div>' +
      '<div class="muted">GPX/KMLは線の形をそのまま保つので、OsmAnd・YAMAP・ジオグラフィカ・Googleマイマップ等に読み込んで案内できます。</div>' +
      '<div class="row" style="margin-top:10px"><button id="dUndo">↶ 戻す</button><button id="dRedo">↷ やり直し</button></div>' +
      '<div class="row"><button class="danger" id="dClear">🧨 手描き線を全消去</button></div>' +
      '<div class="muted">全消去は保存線と旧キーを消します（元に戻せません）。先に「保存（線も含む）」で退避してください。</div>';
    sheet('保存・書き出し・全消去', h, function () {
      el('dSave').onclick = function () { KM2.exp.expAll(); };
      el('dLoad').onclick = function () { KM2.exp.pick(); };
      el('dGpx').onclick = function () { KM2.exp.expGpx(); };
      el('dKml').onclick = function () { KM2.exp.expKml(); };
      el('dUndo').onclick = function () { KM2.draw.undo(); hud(); };
      el('dRedo').onclick = function () { KM2.draw.redo(); hud(); };
      el('dClear').onclick = function () {
        if (!confirm('端末の手描き線データをすべて消します。\n（元に戻せません。必要なら先に「保存（線も含む）」で書き出してください）\n\n実行しますか？')) return;
        S.clearLines(); KM2.draw.replaceAll([]); KM2.draw.save(); hud(); toast('手描き線をすべて消しました');
      };
    });
  }
  function sheetStyle() {
    var cols = ['#e53935', '#ef6c00', '#1e88e5', '#2e7d32', '#212121', '#8e24aa'];
    var h = '<div class="muted">線の色（新しく引く線に適用）</div><div class="row">';
    for (var i = 0; i < cols.length; i++) h += '<button data-c="' + cols[i] + '" style="background:' + cols[i] + ';color:#fff;border-color:' + (KM2.draw.state.color === cols[i] ? '#000' : '#fff') + '">' + (KM2.draw.state.color === cols[i] ? '✔' : '　') + '</button>';
    h += '</div><div class="muted">太さ</div><div class="row">';
    [4, 6, 9].forEach(function (w) { h += '<button data-w="' + w + '"' + (KM2.draw.state.width === w ? ' class="primary"' : '') + '>太さ ' + w + '</button>'; });
    h += '</div><div class="muted">消しゴムの半径</div><div class="row">';
    [12, 22, 40].forEach(function (r) { h += '<button data-r="' + r + '"' + (KM2.draw.state.erR === r ? ' class="primary"' : '') + '>半径 ' + r + 'm</button>'; });
    h += '</div>';
    sheet('色・太さ・消しゴム', h, function () {
      var b = el('sBody');
      b.querySelectorAll('button[data-c]').forEach(function (x) { x.onclick = function () { KM2.draw.setColor(x.getAttribute('data-c')); sheetStyle(); }; });
      b.querySelectorAll('button[data-w]').forEach(function (x) { x.onclick = function () { KM2.draw.setWidth(Number(x.getAttribute('data-w'))); sheetStyle(); }; });
      b.querySelectorAll('button[data-r]').forEach(function (x) { x.onclick = function () { KM2.draw.setEr(Number(x.getAttribute('data-r'))); sheetStyle(); }; });
    });
  }
  function sheetPhoto() {
    var ps = S.getPhotos(), h = '<div class="row"><button class="primary" id="pAdd">📷 写真を撮る／選ぶ</button></div><div class="muted">写真は地図の中心に置かれます。画像は IndexedDB に保存します。</div>';
    h += '<div class="item">';
    for (var i = ps.length - 1; i >= 0; i--) h += '<div style="border-bottom:1px solid #eee;padding:6px 0;display:flex;gap:8px;align-items:center"><img src="' + ps[i].thumb + '" style="width:46px;height:46px;object-fit:cover;border-radius:6px"><div style="flex:1"><b>' + (ps[i].name || '写真') + '</b><br><span class="muted">' + new Date(ps[i].time).toLocaleString('ja-JP') + ' / ' + ps[i].lat.toFixed(5) + ',' + ps[i].lng.toFixed(5) + '</span><br><button data-go="' + i + '">地図で見る</button><button data-del="' + ps[i].id + '">消す</button></div></div>';
    h += '</div>';
    if (!ps.length) h += '<div class="muted">まだ写真がありません</div>';
    sheet('写真（' + ps.length + '枚）', h, function () {
      el('pAdd').onclick = function () { el('fPhoto').click(); };
      var b = el('sBody');
      b.querySelectorAll('button[data-del]').forEach(function (x) { x.onclick = function () { var id = x.getAttribute('data-del'); KM2.media.del(id).then(function () { S.setPhotos(S.getPhotos().filter(function (p) { return p.id !== id; })); KM2.media.render(); sheetPhoto(); hud(); }); }; });
      b.querySelectorAll('button[data-go]').forEach(function (x) { x.onclick = function () { var p = S.getPhotos()[Number(x.getAttribute('data-go'))]; if (p) { map.setView([p.lat, p.lng], 17); close(); } }; });
    });
  }
  function sheetMemo() {
    var ns = S.getNotes(), h = '<div class="muted">メモは地図の中心に置かれます。地図を動かしてから書いてください。</div><textarea id="mText" rows="3" placeholder="例：ここで昼休憩／石碑を見つけた"></textarea><div class="row"><button class="primary" id="mSave">📝 保存</button></div>';
    for (var i = ns.length - 1; i >= 0; i--) h += '<div style="border-bottom:1px solid #eee;padding:6px 0">' + String(ns[i].text).replace(/[<>]/g, '') + '<br><span class="muted">' + new Date(ns[i].time).toLocaleString('ja-JP') + '</span><br><button data-go2="' + i + '">地図で見る</button></div>';
    if (!ns.length) h += '<div class="muted">まだメモがありません</div>';
    sheet('メモ（' + ns.length + '件）', h, function () {
      el('mSave').onclick = function () { var v = el('mText').value.trim(); if (!v) { toast('メモが空です'); return; } KM2.media.addNote(v, center()); sheetMemo(); };
      el('sBody').querySelectorAll('button[data-go2]').forEach(function (x) { x.onclick = function () { var p = S.getNotes()[Number(x.getAttribute('data-go2'))]; if (p) { map.setView([p.lat, p.lng], 17); close(); } }; });
    });
  }
  function sheetPoi() {
    var c = center(), n = KM2.poi.nearest(c.lat, c.lng, 3000);
    var h = '<div class="row"><button class="primary" id="poiT">' + (KM2.poi.isOn() ? '👁 名所を隠す' : '👁 名所を表示') + '</button></div>' +
      '<div class="muted">登録：' + KM2.poi.data().length + ' 件（寺・社・城・史跡・墓・戦跡・宿場）</div>';
    if (n) h += '<div class="kv"><span>地図中心の最寄り</span><b>' + n.n + '（' + n.k + '）</b></div><div class="muted">約 ' + Math.round(n.d) + ' m ・ ' + String(n.note || '').slice(0, 150) + '</div><div class="row"><button id="poiGo">地図で見る</button></div>';
    sheet('名所・史跡・墓', h, function () {
      el('poiT').onclick = function () { KM2.poi.toggle(); sheetPoi(); };
      if (el('poiGo')) el('poiGo').onclick = function () { map.setView([n.lat, n.lng], 17); close(); };
    });
  }
  function sheetSum() {
    sheet('まとめ', '<div id="sumBody">' + KM2.track.build() + '</div><div class="row"><button class="primary" id="sumRec">▶ 記録 開始/停止</button><button id="sumRe">再読み込み</button></div>', function () {
      el('sumRec').onclick = function () { if (KM2.track.isRec()) KM2.track.stop(); else KM2.track.start(); el('sumBody').innerHTML = KM2.track.build(); hud(); };
      el('sumRe').onclick = function () { el('sumBody').innerHTML = KM2.track.build(); };
    });
  }
  function wire() {
    el('bPen').onclick = function () { KM2.draw.setMode('pen'); };
    el('bEra').onclick = function () { KM2.draw.setMode('era'); };
    el('bPan').onclick = function () { KM2.draw.setMode('pan'); };
    el('bUndo').onclick = function () { KM2.draw.undo(); };
    el('bRedo').onclick = function () { KM2.draw.redo(); };
    el('bStyle').onclick = sheetStyle;
    el('bPoi').onclick = sheetPoi;
    el('bPhoto').onclick = sheetPhoto;
    el('bMemo').onclick = sheetMemo;
    el('bNav').onclick = function () { if (KM2.nav.isOn()) KM2.nav.stop(); else KM2.nav.start(); };
    el('bRec').onclick = function () { if (KM2.track.isRec()) KM2.track.stop(); else KM2.track.start(); hud(); };
    el('bSum').onclick = sheetSum;
    el('bData').onclick = sheetData;
    el('sClose').onclick = close;
    el('fPhoto').onchange = function () {
      var f = el('fPhoto').files && el('fPhoto').files[0]; if (!f) return;
      KM2.media.addFile(f, center()).then(function () { toast('写真を保存しました'); sheetPhoto(); }).catch(function (e) { toast('写真を保存できません：' + e); });
      el('fPhoto').value = '';
    };
    window.addEventListener('error', function (ev) { err('エラー：' + (ev.message || '不明')); });
    window.addEventListener('unhandledrejection', function (ev) {
      var m = String((ev.reason && ev.reason.message) || ev.reason || '');
      if (/ServiceWorker|sw\.js/i.test(m)) return;
      err('エラー：' + m);
    });
  }
  var tries = 0;
  function boot() {
    if (typeof L === 'undefined') {
      tries++;
      if (tries < 15) { setTimeout(boot, 400); return; }
      err('地図ライブラリ（Leaflet）を読み込めませんでした。通信を確認して再読み込みしてください。'); return;
    }
    try {
      map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([34.99, 135.78], 11);
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '国土地理院 標準地図' }).addTo(map);
      var mig = S.migrate();
      KM2.draw.init(map); KM2.poi.init(map); KM2.media.init(map); KM2.track.init(map); KM2.nav.init(map);
      wire(); hud();
      if (mig.added > 0) toast('旧データから ' + mig.added + ' 本の線を引き継ぎました（合計 ' + mig.total + ' 本）', 5200);
      else if (mig.total > 0) toast('保存された線 ' + mig.total + ' 本を読み込みました', 3200);
      else toast('v2 起動。右の ✏️ で線を引けます', 4200);
    } catch (e) { err('起動エラー：' + ((e && e.message) || e)); }
  }
  window.__km2 = { map: function () { return map; }, boot: boot, ready: false };

  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
  else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
